services:
  postgres:
    image: postgres:18
    container_name: postgres
    environment:
      POSTGRES_PASSWORD: "password"
    restart: always
    ports:
      - "2403:5432"
    volumes:
      - shailesh_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: backend-app
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: "postgresql://postgres:password@postgres:5432/postgres"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build: .
    image: backend-app
    container_name: backend_application
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:password@postgres:5432/postgres"
    depends_on:
      migrate:
        condition: service_completed_successfully
    develop:
      watch:
        - action: rebuild
          path: ./src

volumes:
  shailesh_pgdata:
